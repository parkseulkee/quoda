[project]
name = "quada"
version = "0.1.0"
description = "Semantic layer + data quality + natural language query agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.15.0",
    "rich>=13.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "litellm>=1.55.0,!=1.82.8",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "plotext>=5.3.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
quada = "quada.cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quada"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
