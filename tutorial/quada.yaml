database:
  type: sqlite
  name: tutorial/tutorial.db

semantic_layer:
  source: local

# API 키는 환경변수로 설정:
#   anthropic → export ANTHROPIC_API_KEY=sk-ant-...
#   openai    → export OPENAI_API_KEY=sk-...
llm:
  orchestrator:
    provider: anthropic
    model: claude-sonnet-4-6
  agents:
    semantic_query:
      provider: anthropic
      model: claude-sonnet-4-6
    quality:
      provider: anthropic
      model: claude-sonnet-4-6
    interpret:
      provider: anthropic
      model: claude-sonnet-4-6
