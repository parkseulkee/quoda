entity:
  name: order
  description: "고객 주문"
  table: public.orders
  columns:
    - name: id
      type: integer
      primary_key: true
    - name: customer_id
      type: integer
    - name: amount
      type: float
    - name: status
      type: string
    - name: order_date
      type: timestamp
    - name: updated_at
      type: timestamp
  relationships:
    - name: customer
      type: many_to_one
      entity: customer
      join: "order.customer_id = customer.id"
