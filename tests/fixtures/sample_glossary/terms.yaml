glossary:
  - term: "이탈 고객"
    definition: "최근 90일간 구매 이력이 없는 고객"
    sql_condition: "customer.last_purchase_date < NOW() - INTERVAL '90 days'"
    entity: customer
    aliases:
      - "churned customer"
      - "이탈자"
      - "비활성 고객"
  - term: "신규 고객"
    definition: "최근 30일 이내 가입한 고객"
    sql_condition: "customer.created_at >= NOW() - INTERVAL '30 days'"
    entity: customer
    aliases:
      - "new customer"
      - "신규 가입자"
