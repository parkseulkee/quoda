quality:
  rules:
    - name: orders_freshness
      type: freshness
      table: orders
      column: updated_at
      threshold: "24 hours"
    - name: orders_status_not_null
      type: null_ratio
      table: orders
      column: status
      threshold: 0.01
    - name: orders_amount_range
      type: value_range
      table: orders
      column: amount
      min: 0
      max: 100000000
